[project]
name = "avoodoo"
version = "0.0.1"
description = "Amaranth port of the SpinalVoodoo 3dfx Voodoo 1 core (Gowin Tang Retro Console 138K first)"
readme = "README.md"
# Amaranth 0.5.10 declares requires-python ~=3.8 and was released 2026-09-10,
# i.e. after CPython 3.14. 3.14 is verified working on both build machines
# (see README "Toolchain"). The upper bound is a guard, not a known failure.
requires-python = ">=3.13,<3.15"
dependencies = [
    "amaranth==0.5.10",
    "amaranth-yosys==0.50.0.0.post128",
    "cocotb==2.1.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avoodoo", "gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
